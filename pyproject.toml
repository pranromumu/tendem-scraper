[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tendem-scraper"
version = "2.0.0"
description = "Production POM web-scraping framework — auto-presets, crawl mode, concurrency, resume, dedupe, S3, Allure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pran", email = "you@example.com" }]
keywords = ["scraping", "playwright", "pom", "allure", "crawler", "shopify", "automation"]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rich>=13.7",
    "playwright>=1.44",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "allure-pytest>=2.13",
]

[project.optional-dependencies]
llm   = ["httpx>=0.27"]
cloud = ["boto3>=1.34"]
dev   = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-html>=4.1",
    "pytest-asyncio>=0.23",
    "allure-pytest>=2.13",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
tendem-scrape = "tendem_scraper.cli:main"
tendem-audit = "tendem_scraper.audit_helper:main"

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Core rule families: style + errors + bugs + security + pylint + refactor.
select = ["E", "F", "I", "UP", "B", "S", "PL", "RUF", "PLC", "PLR", "PLW"]

# Rules intentionally ignored in this project (with reasons).
ignore = [
    # --- deliberate exception handling in a resilient scraper ---
    "BLE001",   # blind "except Exception" — network/browser/HTML all fail unpredictably
    "S110",     # try-except-pass — best-effort cleanup
    "S112",     # try-except-continue — per-page skip
    "S324",     # sha1 — used only for dedupe fingerprints, never for security

    # --- datetime usage is deliberate ---
    "DTZ005",   # datetime.now() — local-time stamps for reports
    "DTZ003",   # datetime.utcnow() — UTC stamps for checkpoints

    # --- style / readability choices ---
    "E741",     # ambiguous 'l' — readable in tight link loops
    "E731",     # lambda assigned to name — esc helper is clearer as lambda
    "FURB167",  # re.I / re.S aliases — style preference
    "UP035",    # typing.Iterable — style preference
    "RUF100",   # unused noqa — harmless
    "RUF001",   # ambiguous unicode in NEXT_TEXT — » and › are intentional
    "EXE001",   # shebang on Windows files

    # --- deliberate code structure in a CLI orchestrator ---
    "B007",     # unused loop var — kept for readability
    "B023",     # closure over loop var — html bound per iteration
    "PLC0415",  # imports inside functions — lazy optional deps (boto3, httpx, playwright)
    "PLR0912",  # too many branches — CLI dispatcher
    "PLR0913",  # too many args — Fetcher/Pipeline constructors
    "PLR0915",  # too many statements — _finalise orchestration
    "PLR0917",  # too many positional — same as above
    "PLR2004",  # magic values — 400, 200, 15 are self-documenting here
    "PLW0602",  # global read without assignment — only reading _T0
    "PLW0603",  # global assignment — deliberate for _T0 and _JSON_PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "E741", "RUF012"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true