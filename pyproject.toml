[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tendem-scraper"
version = "2.0.0"
description = "Production POM web-scraping framework — auto-presets, crawl mode, concurrency, resume, dedupe, S3, Allure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["scraping", "playwright", "pom", "allure", "crawler", "shopify", "automation"]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rich>=13.7",
    "playwright>=1.44",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "allure-pytest>=2.13",
]

[project.optional-dependencies]
llm    = ["httpx>=0.27"]
cloud  = ["boto3>=1.34"]
dev    = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "allure-pytest>=2.13",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
tendem-scrape = "tendem_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "PL", "RUF"]

# Rules intentionally ignored in this project (with reasons):
ignore = [
    "BLE001",   # blind "except Exception" — required for resilient scraping (network, browser, HTML all fail unpredictably)
    "DTZ005",   # datetime.now() without tz — report stamps are local-time by design
    "DTZ003",   # datetime.utcnow() — checkpoint timestamps use UTC by convention
    "S110",     # try-except-pass — intentional best-effort cleanup
    "S112",     # try-except-continue — intentional per-page skip
    "B023",     # closure over loop var — intentional, `html` is bound per iteration
    "PLW0602",  # global without assignment — only reading `_T0`
    "FURB167",  # re.I alias — style preference
    "UP035",    # typing.Iterable — style preference
    "RUF100",   # unused noqa — harmless
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert is fine in tests

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true